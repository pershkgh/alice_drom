name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Синтаксис
        run: |
          python -m compileall -q skill
          bash -n install.sh
          bash -n doctor.sh
      - name: compose валиден
        run: |
          cp .env.example .env
          docker compose --profile ma --profile caddy config --quiet
          echo "compose ok"

  image:
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./skill
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/alice-music-skill:latest
            ghcr.io/${{ github.repository_owner }}/alice-music-skill:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  windows:
    runs-on: windows-latest
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Собрать exe
        shell: bash
        working-directory: windows
        run: |
          dotnet build -c Release
          mkdir -p dist
          cp bin/Release/net48/MusicControl.exe dist/
          cp config.json dist/
      - uses: actions/upload-artifact@v4
        with:
          name: MusicControl
          path: windows/dist/*
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [image, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MusicControl
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          name: Домашняя музыка ${{ github.ref_name }}
          body: |
            Навык для Алисы + пульт для Windows.

            Установка на сервере:
            ```
            git clone ${{ github.server_url }}/${{ github.repository }}.git
            cd alice-music && ./install.sh
            ```
          files: |
            dist/MusicControl.exe
            dist/config.json
          generate_release_notes: true
