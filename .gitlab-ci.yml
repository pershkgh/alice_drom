# Сборка и релизы. Тег вида v1.0.0 запускает полный релиз.
stages: [check, build, release]

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

check:
  stage: check
  image: python:3.12-slim
  script:
    - python -m compileall -q skill
    - bash -n install.sh && bash -n doctor.sh
    - test -f .env.example && test -f docker-compose.yml
    - echo "синтаксис в порядке"

skill:image:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE/skill:$CI_COMMIT_SHORT_SHA" skill
    - docker push "$CI_REGISTRY_IMAGE/skill:$CI_COMMIT_SHORT_SHA"
    - docker tag "$CI_REGISTRY_IMAGE/skill:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE/skill:latest"
    - docker push "$CI_REGISTRY_IMAGE/skill:latest"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$CI_REGISTRY_IMAGE/skill:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE/skill:$CI_COMMIT_TAG"
        docker push "$CI_REGISTRY_IMAGE/skill:$CI_COMMIT_TAG"
      fi

windows:exe:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:8.0
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - cd windows
    - dotnet publish -c Release -r win-x64 --self-contained true
        -p:PublishSingleFile=true
        -p:IncludeNativeLibrariesForSelfExtract=true
        -p:EnableCompressionInSingleFile=true
        -o publish
  artifacts:
    name: "MusicControl-$CI_COMMIT_TAG"
    paths: [windows/publish/MusicControl.exe, windows/publish/config.json]
    expire_in: never

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "публикую релиз $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Домашняя музыка $CI_COMMIT_TAG"
    description: "Навык для Алисы + пульт для Windows. Установка: ./install.sh"
    assets:
      links:
        - name: "MusicControl.exe (Windows)"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/windows/publish/MusicControl.exe?job=windows:exe"
        - name: "install.sh"
          url: "$CI_PROJECT_URL/-/raw/$CI_COMMIT_TAG/install.sh"
